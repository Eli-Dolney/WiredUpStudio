<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Animal model preview · Wired Up Studios</title><style>
*{box-sizing:border-box}body{margin:0;background:#202833;color:#f1f4f8;font:14px system-ui,sans-serif;padding:18px}h2{margin:0 0 6px;font-size:24px}#details,#medium,#status{color:#b5bfcd;font-size:12px}#medium{margin-bottom:12px}canvas{width:100%;height:330px;display:block;touch-action:none}button{background:#29343f;color:#f1f4f8;border:1px solid #657180;border-radius:4px;padding:8px 12px;cursor:pointer}button.selected{background:#d2ff1f;color:#050605;border-color:#d2ff1f}button:focus-visible,input:focus-visible{outline:2px solid #d2ff1f;outline-offset:3px}#clips,.controls{display:flex;flex-wrap:wrap;gap:7px}.controls{margin-top:13px;align-items:center;gap:12px}label{display:flex;gap:6px;align-items:center;font-size:12px}input{accent-color:#d2ff1f;width:75px}#timeline{width:100%;margin:14px 0 0}#animals{display:none}#error{color:#ffe5af;line-height:1.6}@media(max-width:500px){body{padding:12px}canvas{height:270px}.controls{gap:10px}input{width:65px}}
</style></head><body><div id="error" role="status">Loading original model…</div><main hidden><div id="animals"></div><h2 id="animalTitle"></h2><div id="details"></div><canvas aria-label="Interactive animal preview. Drag to orbit, or use Turn and View angle sliders."></canvas><div id="medium"></div><div id="clips" aria-label="Animation clips"></div><input id="timeline" aria-label="Animation timeline" type="range" min="0" max="0.999" step="0.001"><div class="controls"><button id="pause">Pause</button><label>Turn<input id="turn" type="range" min="-3.14" max="3.14" step="0.01" value="0.7"></label><label>View angle<input id="angle" type="range" min="-1.5" max="1.5" step="0.01" value="0.28"></label><label>Zoom<input id="zoom" type="range" min="0.7" max="2" step="0.01" value="1"></label><span id="status"></span></div></main><script type="module">
import {startPreview} from './preview-runtime.js';
try {
 const params=new URLSearchParams(location.search),response=await fetch('./catalog.json');if(!response.ok)throw Error('Catalog unavailable');const catalog=await response.json();const pack=catalog.find(p=>p.id===params.get('pack'));const animal=pack?.animals.find(a=>a.id===params.get('animal'));if(!animal)throw Error('Model unavailable');
 const model=await fetch(`./${pack.id}/${animal.id}.gltf`);if(!model.ok)throw Error('Model download failed');const gltf=await model.json();document.querySelector('main').hidden=false;
 startPreview({[animal.id]:{meta:{...animal,displayName:animal.name},rig:{Bones:gltf.skins[0].joints},gltf}},pack.id);document.querySelector('#error').textContent='';
} catch(e){document.querySelector('main').hidden=true;document.querySelector('#error').textContent='The 3D preview could not load. Please enable WebGL or try another browser. You can still view the pack image and download the original files.';console.error(e)}
</script></body></html>
